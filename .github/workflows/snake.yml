name: snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the reviewed commit (v1 at the time of writing) so the action can't change under you.
      - uses: dahan8473/snake-and-commits@c55d1f1668e849195f395a9d93c56e74b68aaac2
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake.svg
          theme: green
      # Publish to a separate "output" branch so your default branch and contribution graph stay untouched.
      - name: Publish to output branch
        env:
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          git init -q
          git checkout -q -b output
          git add snake.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update snake"
          git push -f "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" output
